name: HELLO WROLD

on: 
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      name:
        description: Who to greet
        type: string
        default: Fucker
      polite:
        description: Should I be polite
        type: boolean
        default: false
      

permissions:
  contents: read
  
env:
  GREETING: Suprise

jobs:
  greet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mail: ${{ steps.notcompose.outputs.mail }}
    steps: 
      - name: NotCompose the message
        id: notcompose
        env: 
          NAME: ${{ inputs.name || 'Fighter'}}
          POLITE: ${{ inputs.polite }}

        run: |
            mail="$GREETING, $NAME!"
            if [ "$SHOUT" = "true" ]; then
            mail="${mail^^}"
            fi
            echo "mail=$mail" >> "$GITHUB_OUTPUT"
    
    
  report:
    needs: greet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print the mail
        env:
          MAIL: ${{ needs.greet.outputs.mail }}
        run: echo "$MAIL"

      - name: Runs only when started manually
        if: github.event_name == 'workflow_dispatch'
        run: echo "Started from the Actions tab or with gh workflow run"